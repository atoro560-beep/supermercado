<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - Catálogo Web Interactivo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fff5f5;
            color: #2b0b0b;
        }

        /* Header */
        header {
            background-color: #8b0000;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-bar {
            width: 40%;
            display: flex;
        }

        .search-bar input {
            width: 100%;
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 20px 0 0 20px;
            outline: none;
            font-size: 0.95rem;
        }

        .search-bar button {
            padding: 0.6rem 1.2rem;
            border: none;
            background-color: #b30000;
            color: white;
            border-radius: 0 20px 20px 0;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-icon {
            background-color: #b30000;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .cart-icon:hover {
            background-color: #d10000;
        }

        /* Container Principal */
        .main-container {
            display: flex;
            padding: 2rem;
            gap: 2rem;
            max-width: 1300px;
            margin: 0 auto;
        }

        .catalog-section {
            flex: 3;
        }

        /* Filtros */
        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 0.5rem 1rem;
            border: 1px solid #b30000;
            background-color: white;
            color: #b30000;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .category-btn.active, .category-btn:hover {
            background-color: #b30000;
            color: white;
        }

        /* Banner */
        .promos-banner {
            background: linear-gradient(135deg, #ffe1e1, #ffffff);
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            border-left: 5px solid #b30000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .promos-banner h3 {
            color: #8b0000;
            margin-bottom: 0.3rem;
        }

        .btn-promo {
            background-color: #8b0000;
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Grilla de Productos */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 0.8rem;
        }

        .product-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 0.3rem;
        }

        .product-price {
            font-size: 1.1rem;
            color: #8b0000;
            font-weight: bold;
            margin-bottom: 0.3rem;
        }

        .product-stock {
            font-size: 0.85rem;
            color: #b00020;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .product-stock.low {
            color: #dc3545;
        }

        .btn-add {
            background-color: #8b0000;
            color: white;
            border: none;
            padding: 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background-color: #b30000;
        }

        /* Carrito Lateral */
        .cart-summary {
            flex: 1;
            background: white;
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            height: fit-content;
        }

        .cart-summary h3 {
            margin-bottom: 1rem;
            border-bottom: 2px solid #fff5f5;
            padding-bottom: 0.5rem;
        }

        .cart-list {
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 1rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }

        .cart-item-controls {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .btn-qty {
            background-color: #e9ecef;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-total {
            border-top: 2px solid #fff5f5;
            padding-top: 1rem;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .btn-order {
            background-color: #a30000;
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 1rem;
            transition: background 0.2s;
        }

        .btn-order:hover {
            background-color: #7f0000;
        }

        .empty-msg {
            color: #888;
            font-size: 0.9rem;
            text-align: center;
            padding: 1rem 0;
        }

        /* Modal Mensaje */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .modal-content h2 {
            color: #8b0000;
            margin-bottom: 0.5rem;
        }

        .modal-content button {
            margin-top: 1.5rem;
            background: #8b0000;
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    
        /* Detalles Halloween: rojo, blanco y negro */
        body::before {
            content: "🕷️";
            position: fixed;
            top: 75px;
            right: 18px;
            font-size: 2rem;
            opacity: 0.16;
            pointer-events: none;
            z-index: 1;
        }

        .promos-banner {
            background: linear-gradient(135deg, #ffe5e5, #ffffff);
            border-left-color: #8b0000;
        }

        .promos-banner h3 {
            color: #8b0000;
        }

        .product-card:hover {
            border-color: #b30000;
            box-shadow: 0 8px 20px rgba(139, 0, 0, 0.18);
        }

        .product-img {
            border: 2px solid #f0caca;
        }

        .category-btn.active,
        .category-btn:hover {
            background-color: #8b0000;
            color: white;
        }

    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span>📦 StockFlow</span>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Buscar por nombre...">
            <button onclick="filterProducts()">Buscar</button>
        </div>
        <div class="cart-icon" onclick="scrollToCart()">
            🛒 Mi Pedido (<span id="cartCount">0</span>)
        </div>
    </header>

    <div class="main-container">
        <div class="catalog-section">
            <div class="promos-banner">
                <div>
                    <h3>🎃 🔥 Combo Mayorista del Mes</h3>
                    <p>🕷️ Lleva Combo de Abarrotes Especial con 15% de Descuento. 👻</p>
                </div>
                <button class="btn-promo" onclick="addPromoCombo()">Agregar Combo</button>
            </div>

            <div class="categories">
                <button class="category-btn active" onclick="filterCategory('Todos', this)">Todos</button>
                <button class="category-btn" onclick="filterCategory('Abarrotes', this)">Abarrotes</button>
                <button class="category-btn" onclick="filterCategory('Lácteos', this)">Lácteos</button>
                <button class="category-btn" onclick="filterCategory('Bebidas', this)">Bebidas</button>
                <button class="category-btn" onclick="filterCategory('Combos', this)">Combos</button>
            </div>

            <div class="products-grid" id="productsGrid">
                <!-- Se llena dinámicamente con JavaScript -->
            </div>
        </div>

        <div class="cart-summary" id="cartSection">
            <h3>Resumen del Pedido</h3>
            <div class="cart-list" id="cartList">
                <p class="empty-msg">Tu carrito está vacío</p>
            </div>
            <div class="cart-total">
                <span>Total Estimado:</span>
                <span id="cartTotal">$ 0</span>
            </div>
            <button class="btn-order" onclick="confirmOrder()">Confirmar Pedido Anticipado</button>
        </div>
    </div>

    <!-- Modal de Confirmación -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <h2>¡Pedido Confirmado! 🎉</h2>
            <p id="modalMessage">Tu pedido ha sido recibido y enviado a la bodega para su preparación.</p>
            <button onclick="closeModal()">Aceptar</button>
        </div>
    </div>

        ];

        let cart = [];
        let activeCategory = "Todos";

        // Renderizar productos en la grilla
        function renderProducts(itemsToRender = products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            if (itemsToRender.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding:2rem;">No se encontraron productos.</p>';
                return;
            }

            itemsToRender.forEach(product => {
                const isLow = product.stock < 15;
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.img}" alt="${product.name}" class="product-img">
                    <div class="product-title">${product.name}</div>
                    <div class="product-price">$ ${product.price.toLocaleString()} / ud</div>
                    <div class="product-stock ${isLow ? 'low' : ''}">
                        ${isLow ? '⚠️ Útimas unidades:' : '✓ Stock en bodega:'} ${product.stock} uds
                    </div>
                    <button class="btn-add" onclick="addToCart(${product.id})">Agregar al Pedido</button>
                `;
                grid.appendChild(card);
            });
        }

        // Agregar al Carrito
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (product.stock <= 0) {
                alert("Producto agotado en bodega.");
                return;
            }

            const cartItem = cart.find(item => item.id === productId);
            if (cartItem) {
                if (cartItem.qty < product.stock) {
                    cartItem.qty++;
                } else {
                    alert("Alcanzaste el límite de stock disponible en bodega.");
                }
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCart();
        }

        // Modificar Cantidad en el Carrito
        function changeQty(productId, delta) {
            const cartItem = cart.find(item => item.id === productId);
            const product = products.find(p => p.id === productId);

            if (cartItem) {
                cartItem.qty += delta;
                if (cartItem.qty > product.stock) {
                    cartItem.qty = product.stock;
                    alert("No hay más unidades en stock.");
                }
                if (cartItem.qty <= 0) {
                    cart = cart.filter(item => item.id !== productId);
                }
            }
            updateCart();
        }

        // Actualizar vista del Carrito
        function updateCart() {
            const cartList = document.getElementById('cartList');
            const cartTotal = document.getElementById('cartTotal');
            const cartCount = document.getElementById('cartCount');

            cartList.innerHTML = '';
            let total = 0;
            let totalItems = 0;

            if (cart.length === 0) {
                cartList.innerHTML = '<p class="empty-msg">Tu carrito está vacío</p>';
            } else {
                cart.forEach(item => {
                    const subtotal = item.price * item.qty;
                    total += subtotal;
                    totalItems += item.qty;

                    const itemElement = document.createElement('div');
                    itemElement.className = 'cart-item';
                    itemElement.innerHTML = `
                        <div>
                            <strong>${item.name}</strong><br>
                            <small>$ ${item.price.toLocaleString()} x ${item.qty}</small>
                        </div>
                        <div class="cart-item-controls">
                            <button class="btn-qty" onclick="changeQty(${item.id}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="btn-qty" onclick="changeQty(${item.id}, 1)">+</button>
                        </div>
                    `;
                    cartList.appendChild(itemElement);
                });
            }

            cartTotal.innerText = `$ ${total.toLocaleString()}`;
            cartCount.innerText = totalItems;
        }

        // Filtrar por Categorías
        function filterCategory(category, btnElement) {
            activeCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            if (category === "Todos") {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => p.category === category);
                renderProducts(filtered);
            }
        }

        // Filtrar por Búsqueda
        function filterProducts() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => 
                (activeCategory === "Todos" || p.category === activeCategory) &&
                p.name.toLowerCase().includes(term)
            );
            renderProducts(filtered);
        }

        // Agregar Promo Especial
        function addPromoCombo() {
            addToCart(7); // Agrega el combo especial
        }

        // Confirmar Pedido
        function confirmOrder() {
            if (cart.length === 0) {
                alert("El carrito está vacío. Selecciona productos primero.");
                return;
            }

            // Descontar del stock local
            cart.forEach(item => {
                const prod = products.find(p => p.id === item.id);
                if (prod) prod.stock -= item.qty;
            });

            document.getElementById('orderModal').style.display = 'flex';
            cart = [];
            updateCart();
            renderProducts(products);
        }

        function closeModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function scrollToCart() {
            document.getElementById('cartSection').scrollIntoView({ behavior: 'smooth' });
        }

        // Event listener para búsqueda en tiempo real
        document.getElementById('searchInput').addEventListener('keyup', filterProducts);

        // Render Inicial
        renderProducts();
    </script>
